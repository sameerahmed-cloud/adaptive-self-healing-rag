version: '3.8'

services:
  qdrant_db:
    image: qdrant/qdrant:latest
    container_name: local_qdrant_service
    ports:
      - "6333:6333"  # API port for your python script
      - "6334:6334"  # Internal gRPC communication port
    volumes:
      - qdrant_storage:/qdrant/storage 
    restart: always

volumes:
  qdrant_storage:
